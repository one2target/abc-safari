<style>
/* Layout and theme */
:root {

}
button {

svg {

  flex-direction:column;
}
.topbar {

}

}

}

main {

}
.screen {

 const type=c.phase==='lesson'?currentLessonStep(c)?.type:AppState.game.types[AppState.game.index];
 if(!type)return null;
 const pool=c.phase==='lesson'?letters:gamePool();
 const saved=AppState.question;
 const fits=saved&&validQuestion(saved)&&saved.type===type&&(c.phase==='lesson'?saved.letter===letters[c.index].letter:pool.some(d=>d.letter===saved.letter)&&saved.options.every(l=>pool.some(d=>d.letter===l)));
 if(!fits){const d=c.phase==='lesson'?letters[c.index]:getWeightedRandomLetter(pool,AppState.game.recent);AppState.question=createQuestion(type,d,pool,c.phase==='lesson');saveProgress();}
 return AppState.question;
}

const failedImages=new Set();
const characterImagePromises=new Map();
function loadCharacterImage(source){
 if(!source)return Promise.reject(new Error('Missing character asset source'));
 if(characterImagePromises.has(source))return characterImagePromises.get(source);
 const promise=new Promise((resolve,reject)=>{
  const image=new Image();
  image.decoding='async';
  image.onload=()=>resolve(image);
  image.onerror=()=>{if(!failedImages.has(source)){failedImages.add(source);console.warn('[Alfie image] Image could not be loaded:',source);}reject(new Error(`Character image failed: ${source}`));};
  image.src=source;
  if(image.complete&&image.naturalWidth>0)resolve(image);
 });
 characterImagePromises.set(source,promise);
 return promise;
}
async function renderMariusComposite(canvas,composition,loadImage=loadCharacterImage){
 const context=canvas?.getContext?.('2d');
 if(!context)return false;
 const renderId=String((Number(canvas.dataset.mariusRenderId)||0)+1);
 canvas.dataset.mariusRenderId=renderId;
 const sources=CHARACTER_LAYER_ORDER.map(slot=>composition[slot]).filter(Boolean);
 let images;
 try{images=await Promise.all(sources.map(source=>loadImage(source)));}
 catch(error){if(canvas.dataset.mariusRenderId!==renderId)return false;context.clearRect(0,0,characterConfig.width,characterConfig.height);throw error;}
 if(canvas.dataset.mariusRenderId!==renderId||canvas.isConnected===false)return false;
 context.clearRect(0,0,characterConfig.width,characterConfig.height);
 images.forEach(image=>context.drawImage(image,0,0,characterConfig.width,characterConfig.height));
 return true;
}
function wireCharacterComposites(root=document,loadImage=loadCharacterImage){

  const slots=(canvas.dataset.mariusSlots||'').split(',').filter(Boolean),sources=canvas.dataset.mariusSources.split('|').filter(Boolean);
  const composition=Object.fromEntries(slots.map((slot,index)=>[slot,sources[index]]).filter(([,source])=>source));
  return renderMariusComposite(canvas,composition,loadImage).then(drawn=>{if(drawn)canvas.closest('.character-stage')?.classList.remove('composite-unavailable');return drawn;}).catch(()=>{canvas.closest('.character-stage')?.classList.add('composite-unavailable');return false;});
 });
 return Promise.all(draws);
}
function wireMedia(root=document){

 root.querySelectorAll('img[data-fallback]').forEach(img=>{const fallback=()=>{img.replaceWith(document.createTextNode(img.dataset.fallback));};img.addEventListener('error',fallback,{once:true});if(img.complete&&img.naturalWidth===0)fallback();});

function addBalloonBurst(button){

 const rect=button.getBoundingClientRect(),field=button.closest('.balloon-pop-field'),burst=document.createElement('span');

 burst.style.left=`${rect.left+rect.width/2}px`;burst.style.top=`${rect.top+rect.height*.4}px`;

  particle.style.setProperty('--particle-angle',`${angle.toFixed(1)}deg`);

function playBalloonPopEffect(){

 const Context=window.AudioContext||window.webkitAudioContext;if(!Context)return;
 try{
  balloonAudioContext=balloonAudioContext||new Context();if(balloonAudioContext.state==='suspended')balloonAudioContext.resume();
  const oscillator=balloonAudioContext.createOscillator(),gain=balloonAudioContext.createGain(),now=balloonAudioContext.currentTime;
  oscillator.type='triangle';oscillator.frequency.setValueAtTime(430,now);oscillator.frequency.exponentialRampToValueAtTime(120,now+.085);
  gain.gain.setValueAtTime(.075,now);gain.gain.exponentialRampToValueAtTime(.001,now+.09);oscillator.connect(gain).connect(balloonAudioContext.destination);oscillator.start(now);oscillator.stop(now+.095);
 }catch(_){/* Voice audio remains available if Web Audio is unsupported. */}
}

function begin(){unlockAudio();AppState.started=true;go('course');preloadFeedbackStickers();}
function nextLessonStep(){if(answerLocked)return;AppState.cursor.step++;AppState.question=null;go('course');}
function completeTranslationQuestion(){const c=AppState.cursor;if(c.phase!=='lesson'||currentLessonStep(c)?.type!==TRANSLATION_TYPE)return false;c.step++;AppState.question=null;saveProgress();return true;}
function advanceAfterLetter(){const c=AppState.cursor;if((c.index+1)%GROUP_SIZE===0||c.index===letters.length-1)c.phase=c.index===2&&!findObjectComplete(ABC_FIND_OBJECT_GAME)?'room':c.index===5?'maze':'miniIntro';else{c.index++;c.phase='lesson';c.step=0;}AppState.question=null;go('course');}
function advanceAfterMini(){const c=AppState.cursor;if(c.index===letters.length-1)c.phase=AppState.completedBlocks.includes('reward_ghi')?'finalIntro':'balloon_ghi';else{c.index++;c.phase='lesson';c.step=0;}AppState.game=null;AppState.question=null;go('course');}
function completeQuestion(){const c=AppState.cursor,q=AppState.question;
 if(c.phase==='lesson'&&q?.type===TRANSLATION_TYPE)return completeTranslationQuestion();
 registerCorrectAnswer(q);
 if(c.phase==='lesson'){if(c.step<lessonSteps(letters[c.index]).length-1)c.step++;else c.phase='letterReward';}
 else{AppState.game.recent.push(q.letter);AppState.game.recent=AppState.game.recent.slice(-3);AppState.game.index++;const length=c.phase==='final'?FINAL_LENGTH:MINI_LENGTH;if(AppState.game.index>=length){if(c.phase==='final'){c.phase='results';AppState.completed=true;}else {c.phase='miniResult';if(c.index!==letters.length-1)finishBlock();}AppState.game=null;}}
 AppState.question=null;saveProgress();
}
function celebrate(){const box=$('#confetti');box.innerHTML=Array.from({length:15},(_,i)=>`<i style="--x:${Math.round((Math.random()-.5)*430)}px;--y:${Math.round((Math.random()-.55)*400)}px;--r:${Math.round(Math.random()*300)}deg;color:${['#e4ad25','#4d9873','#a98acc','#ed9058'][i%4]}">${i%3?'✦':'★'}</i>`).join('');}
/* Answer and completion stickers share one selection history, never saved. */
const SUCCESS_STICKERS=Array.from({length:9},(_,i)=>`./images/stickers/marius_success_${String(i+1).padStart(2,'0')}.png`);
const RETRY_STICKER='./images/stickers/marius_retry_01.png';
let lastSuccessSticker=null,stickersWarmed=false;
function pickSuccessSticker(){
 const choices=SUCCESS_STICKERS.filter(src=>SUCCESS_STICKERS.length===1||src!==lastSuccessSticker);
 lastSuccessSticker=choices.length?choices[Math.floor(Math.random()*choices.length)]:null;
 return lastSuccessSticker;
}
function renderCompletionSticker(){
 const src=pickSuccessSticker();
 return src?`<img class="feedback-sticker success completion-sticker" data-feedback-sticker src="${escapeHTML(src)}" width="1254" height="1254" alt="" aria-hidden="true" draggable="false" decoding="async">`:'';
}
function prepareFeedbackSticker(img){
 img.onload=()=>{img.classList.add('ready');};
 img.onerror=()=>{img.remove();};
 if(img.complete){if(img.naturalWidth>0)img.onload();else img.onerror();}
}
function preloadFeedbackStickers(){
 if(stickersWarmed||typeof Image==='undefined')return;
 stickersWarmed=true;
 // Start after the first user action, two low-priority downloads at a time.
 const pending=[RETRY_STICKER,...SUCCESS_STICKERS];
 const next=()=>{const src=pending.shift();if(!src)return;const img=new Image();img.decoding='async';img.fetchPriority='low';img.onload=img.onerror=()=>{img.onload=img.onerror=null;next();};img.src=src;};
 setTimeout(()=>{next();next();},250);
}
function showAnswerFeedback(kind,message){
 const box=$('#feedback');if(!box)return;
 const src=kind==='success'?pickSuccessSticker():RETRY_STICKER;
 const text=document.createElement('span');text.className='feedback-message';text.textContent=message;
 // Replacing the contents also removes an earlier retry or success sticker.
 box.replaceChildren();box.classList.add('illustrated');
 if(src){
  const img=document.createElement('img');img.className=`feedback-sticker ${kind}`;img.alt='';img.setAttribute('aria-hidden','true');img.draggable=false;img.decoding='async';
  img.src=src;box.appendChild(img);
  prepareFeedbackSticker(img);
 }
 box.appendChild(text);
}
function checkAnswer(button){
 if(answerLocked||!AppState.question)return;answerLocked=true;unlockAudio();stopAudio();const q=AppState.question,translationQuiz=q.type===TRANSLATION_TYPE,correct=button.dataset.answer===q.letter;
 document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
 if(!correct){if(!translationQuiz)registerMistake(q);button.classList.add('wrong');showAnswerFeedback('retry','Попробуй ещё раз!');AudioManager.play(ru('try_again'));const epoch=viewEpoch;transitionTimer=setTimeout(()=>{if(epoch!==viewEpoch)return;answerLocked=false;button.classList.remove('wrong');document.querySelectorAll('.choice').forEach(b=>b.disabled=false);button.focus({preventScroll:true});},DEMO?100:700);return;}
 const d=byLetter.get(q.letter);button.classList.add('correct');celebrate();const praise=getRandomItems(['correct','great','well_done','super','amazing'],1)[0];
 if(translationQuiz){
  showAnswerFeedback('success',`${d.word} ${d.emoji}`);
  const finishFeedback=AudioManager.play(translatedWord(d));
  completeQuestion();document.querySelectorAll('#main button').forEach(b=>b.disabled=true);
  const epoch=viewEpoch;transitionTimer=setTimeout(()=>{finishFeedback.then(()=>{if(epoch!==viewEpoch)return;showScreen();});},DEMO?100:1100);return;
 }
 showAnswerFeedback('success',['letterPicture','pictureLetter','wordPicture'].includes(q.type)?`${d.letter} → ${d.word} ${d.emoji}`:q.type==='lowercase'?`${d.letter} → ${d.lowercase} ★`:AUDIO_TEXT[praise]);
 const finishFeedback=AudioManager.playSequence([ru(praise),enName(d),enWord(d)]);
 // Commit the next position immediately. Closing during confetti never counts twice.
 completeQuestion();document.querySelectorAll('#main button').forEach(b=>b.disabled=true);
 const epoch=viewEpoch;transitionTimer=setTimeout(()=>{finishFeedback.then(()=>{if(epoch!==viewEpoch)return;if(AppState.rewardFlow){view='reward';rewardReady=Boolean(AppState.rewardFlow.selected);}showScreen();});},DEMO?100:1100);
}
function updateSoundButton(){const b=$('#sound-button');b.textContent=AppState.soundEnabled?'🔊':'🔇';b.setAttribute('aria-label',AppState.soundEnabled?'Turn sound off':'Turn sound on');b.setAttribute('aria-pressed',String(!AppState.soundEnabled));}
function toggleSound(){
 unlockAudio();AppState.soundEnabled=!AppState.soundEnabled;AudioManager.setEnabled(AppState.soundEnabled);saveProgress();updateSoundButton();
 if(AppState.cursor.phase==='balloon_ghi'&&!balloonPopState().gameCompleted){
  const target=document.querySelector('[data-balloon-target]');clearTimeout(balloonTargetTimer);
  if(target&&!AppState.soundEnabled){const letter=BalloonPopGame.target(GHI_BALLOON_GAME,balloonPopState());target.textContent=letter;target.classList.remove('is-hidden');}
  if(AppState.soundEnabled&&!answerLocked)repeatBalloonInstruction();
 }else if(AppState.soundEnabled&&!answerLocked)repeatInstruction();
}
function openProgress(){if(view==='progress'){go(lastView);return;}lastView=view;go('progress');}
/* Dialogs trap focus, support Escape, and always confirm an explicit reset. */
function openModal(html){if(answerLocked)go('course');stopAudio();const layer=$('#modal-layer');if(layer.hidden)restoreFocus=document.activeElement;layer.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" lang="ru">${html}</section>`;layer.hidden=false;$('#app').inert=true;layer.querySelector('button')?.focus();wireMedia();}
function closeModal(){const layer=$('#modal-layer');layer.hidden=true;layer.replaceChildren();$('#app').inert=false;if(restoreFocus?.isConnected)restoreFocus.focus();}
function showReset(){openModal(`<div class="modal-head"><h2 id="modal-title">Начать сначала?</h2></div><p>Все звёзды и подарки будут сброшены. Жирафик снова будет без одежды. Настройка звука сохранится.</p><div class="modal-actions"><button class="secondary" data-action="close-modal">Продолжить игру</button><button class="primary" data-action="confirm-reset">Начать заново</button></div>`);}
function resetProgress(){const sound=AppState.soundEnabled;stopAudio();clearTimeout(transitionTimer);Object.assign(AppState,initialState(),{soundEnabled:sound});rewardReady=false;AudioManager.setEnabled(sound);closeModal();go('home');}
function showParentGate(){openModal(`<div class="modal-head"><h2 id="modal-title">Для родителей</h2><button class="icon-button" data-action="close-modal" aria-label="Закрыть">×</button></div><p>Можно удерживать Parents две секунды или ответить:</p><p style="font-size:32px;font-weight:800;color:var(--ink);margin-top:20px">Сколько будет 7 + 5?</p><div class="modal-actions"><button class="secondary" data-action="gate-retry">10</button><button class="primary" data-action="parent-view">12</button><button class="secondary" data-action="gate-retry">14</button></div><p id="gate-message" role="status" style="min-height:24px;margin-top:15px"></p>`);}
function renderParentView(){const totals=Object.values(AppState.stats).reduce((a,s)=>({attempts:a.attempts+s.attempts,correct:a.correct+s.correct,mistakes:a.mistakes+s.mistakes}),{attempts:0,correct:0,mistakes:0});
 openModal(`<div class="modal-head"><h2 id="modal-title">Для родителей</h2><button class="icon-button" data-action="close-modal" aria-label="Закрыть">×</button></div><p>Звезда — три связи: найти букву, выбрать картинку и узнать букву по картинке.</p><div class="stats-totals"><div><b>${totals.attempts}</b>Всего ответов</div><div><b>${totals.correct}</b>Правильных</div><div><b>${totals.mistakes}</b>Ошибок</div></div><table class="stats-table"><thead><tr><th>Буква</th><th>Освоение</th><th>Связи</th><th>Ошибки</th></tr></thead><tbody>${letters.map(d=>{const s=AppState.stats[d.letter],status=s.mastery===3?'★ Освоена':!s.attempts?'Ещё впереди':s.practiceDebt?'Повторяем':'Изучаем';return `<tr><td>${escapeHTML(d.letter)}</td><td class="status-tag">${status}</td><td>${s.mastery} / 3</td><td>${s.mistakes}</td></tr>`;}).join('')}</tbody></table><p>При ошибке буква чаще встречается в играх. Исправленный ответ тоже считается успешной связью.</p><p style="margin-top:12px">Озвучка: готовые записи из audio/. Инструкции — по-русски, буквы, звуки и слова — по-английски. Между репликами пауза 0,5 секунды.</p><p style="margin-top:12px">Прогресс хранится только в этом браузере${DEMO?' (отдельный деморежим)':''}.</p><div class="modal-actions"><button class="secondary" data-action="close-modal">В игру</button><button class="secondary" data-action="reset">Сбросить прогресс</button></div>`);
}
let holdTimer=null;
function startHold(event){if(event.type==='keydown'&&![' ','Enter'].includes(event.key))return;if(event.type==='keydown'){event.preventDefault();if(event.repeat)return;}if(event.type==='pointerdown'&&event.button!==0)return;cancelHold();$('#parent-button').classList.add('holding');holdTimer=setTimeout(()=>{cancelHold();renderParentView();},2000);}
function cancelHold() {clearTimeout(holdTimer);holdTimer=null;$('#parent-button').classList.remove('holding');}
$('#parent-button').addEventListener('click',()=>{if($('#modal-layer').hidden)showParentGate();});
$('#parent-button').addEventListener('pointerdown',startHold);$('#parent-button').addEventListener('keydown',startHold);['pointerup','pointerleave','pointercancel','keyup','blur','contextmenu'].forEach(type=>$('#parent-button').addEventListener(type,event=>{if(type==='contextmenu')event.preventDefault();const shortKey=type==='keyup'&&[' ','Enter'].includes(event.key)&&holdTimer!==null;cancelHold();if(shortKey&&$('#modal-layer').hidden)showParentGate();}));
$('#sound-button').addEventListener('click',toggleSound);$('#home-button').innerHTML=icons.home;$('#home-button').addEventListener('click',()=>go('home'));$('#progress-button').addEventListener('click',openProgress);
/* Empty parts of the illustration are gentle retries, never scored mistakes. */
document.addEventListener('click',event=>{if(event.target.closest('.find-object-scene')&&!event.target.closest('button')){const entry=activeFindObjectEntry();if(entry)findObjectPick(null,entry.scene.id);}});
/* EVENTS */
const actions={
 'balloon-pop':button=>tapBalloonPop(button.dataset.letter,button),
 'balloon-repeat':repeatBalloonInstruction,
 'balloon-continue':continueBalloonPopGame,
 'letter-maze-move':button=>letterMazeMove(button.dataset.cell,button.dataset.game),
 'letter-maze-next':button=>nextLetterMazeRound(button.dataset.game),
 'letter-maze-continue':button=>continueLetterMazeGame(button.dataset.game),
 'find-object-pick':button=>findObjectPick(button.dataset.object,button.dataset.game),
 'find-object-next':button=>nextFindObjectRound(button.dataset.game),
 'find-object-continue':button=>continueFindObjectGame(button.dataset.game),
 'find-object-replay':button=>replayFindObjectGame(button.dataset.game),
 'find-object-reload':button=>{if(activeFindObjectEntry()?.scene.id===button.dataset.game)go('course');},
 'claim-reward':button=>chooseReward(button.dataset.item),
 'reward-next':continueReward,
 equip:button=>{if(equipItem(button.dataset.item))showScreen();},
 unequip:button=>{if(unequipItem(button.dataset.item))showScreen();},
 'parent-view':renderParentView,
 'gate-retry':()=>{$('#gate-message').textContent='Попробуйте ещё раз.';},
 start:begin,
 next:nextLessonStep,
 repeat:()=>{unlockAudio();const focus=$('#audio-focus');if(focus){focus.classList.remove('pulsing');void focus.offsetWidth;focus.classList.add('pulsing');}repeatInstruction();},
 'after-letter':advanceAfterLetter,
 'play-mini':()=>startGame(false),
 'play-final':()=>startGame(true),
 'after-mini':advanceAfterMini,
 reset:showReset,
 'confirm-reset':resetProgress,
 'close-modal':closeModal,
 progress:openProgress,
 back:()=>go(lastView),
 replay:()=>{AppState.cursor.phase='finalIntro';AppState.question=null;go('course');},
 'demo-next':()=>{
  if(!DEMO)return;
  if(view==='home')begin();
  else if(view==='progress')go(lastView);
 else if(view==='reward'){if(AppState.rewardFlow?.selected)continueReward();}
  else{
   const c=AppState.cursor,entry=activeFindObjectEntry(),mazeEntry=activeLetterMazeEntry();
   if(c.phase==='lesson'){if(currentLessonStep(c)?.kind==='card')nextLessonStep();else checkAnswer(document.querySelector(`[data-answer="${AppState.question.letter}"]`));}
   else if(['mini','final'].includes(c.phase))checkAnswer(document.querySelector(`[data-answer="${AppState.question.letter}"]`));
   else if(c.phase==='letterReward')advanceAfterLetter();
   else if(c.phase==='balloon_ghi')advanceBalloonPopDemo();
   else if(entry){const config=entry.scene;const state=findObjectState(config);if(state.gameCompleted)continueFindObjectGame(config.id);else if(HiddenObjectGame.roundComplete(config,state))nextFindObjectRound(config.id);else findObjectPick(HiddenObjectGame.currentRound(config,state).targets.find(id=>!state.foundObjects.includes(id)),config.id);}
   else if(mazeEntry){const config=mazeEntry.scene,state=letterMazeState(config);if(state.gameCompleted)continueLetterMazeGame(config.id);else if(LetterMazeGame.roundComplete(config,state))nextLetterMazeRound(config.id);else selectLetterMazeCell(LetterMazeGame.nextLetterCell(config,state),config.id);}
   else if(c.phase==='miniIntro')startGame();
   else if(c.phase==='miniResult')advanceAfterMini();
   else if(c.phase==='finalIntro')startGame(true);
   else actions.replay();
  }
 }
};
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;unlockAudio();if(button.hasAttribute('data-answer'))checkAnswer(button);else if(actions[button.dataset.action])actions[button.dataset.action](button);});
document.addEventListener('keydown',event=>{const layer=$('#modal-layer');if(layer.hidden)return;if(event.key==='Escape'){event.preventDefault();closeModal();}if(event.key==='Tab'){const buttons=[...layer.querySelectorAll('button:not(:disabled)')];const first=buttons[0],last=buttons.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopAudio();cancelHold();saveProgress();}});window.addEventListener('pagehide',()=>{stopAudio();saveProgress();});
/* INIT — preload the nine active supplied images, including reward card icons. */
// Preload only the two images needed on the first screen.
for(const key of ['background_home','giraffe_base']){
  const asset=MEDIA_ASSETS.images[key];
  if(!asset)continue;
  const link=document.createElement('link');
  link.rel='preload';
  link.as='image';
  link.href=asset.src;
  document.head.appendChild(link);
}
// A reward in progress reopens automatically; audio still waits for a gesture.
showScreen();
if(AppState.started)saveProgress();
</script>
</body>
</html>
